name: Build macOS-Style Archiso

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من صفحة GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # صلاحيات جذر ضرورية لأداة mkarchiso

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Archiso and Tools
        run: |
          pacman -Syu --noconfirm archiso git

      - name: Build ISO Image
        run: |
          mkdir -p out
          mkarchiso -v -w /tmp/archiso-work -o ./out ./configs/macos-style

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-linux-iso
          path: out/*.iso
